name: Build dylib
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Randomblock1/theos-action@v1
      - name: Build
        working-directory: WolfAnimatedProfile/WolfAnimatedProfile
        run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: WolfAnimatedProfile
          path: |
            WolfAnimatedProfile/WolfAnimatedProfile/.theos/obj/WolfAnimatedProfile.dylib
            WolfAnimatedProfile/WolfAnimatedProfile/packages/*.deb
